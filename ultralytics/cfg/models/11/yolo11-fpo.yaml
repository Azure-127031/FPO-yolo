# FPO-YOLO: AAD + BCSG + CIHF + PASF, with prediction strides 4/8/16.
# C3k2_BCSG args: [c2, shortcut, e, g=1, c3k=False].
# All existing layers below use BCSG; True/False in position 2 controls shortcuts.
# Optional standard C3k example: [256, True, 0.6, 1, True].
# Dataset YAML overrides nc during training.
nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, AAD_v2, [128, 3]]
  - [-1, 2, C3k2_BCSG, [256, True, 0.6]]
  - [-1, 1, AAD_v2, [256, 3]]
  - [-1, 2, C3k2_BCSG, [512, True, 0.5]]
  - [-1, 1, AAD_v2, [512, 3]]
  - [-1, 2, C3k2_BCSG, [512, False, 0.4]]
  - [-1, 1, SPPF, [512, 5]]
  - [-1, 2, C2PSA, [512]]

head:
  # CIHF aligns B2/B3/B4 context to the P2 grid before neck construction.
  - [[2, 4, 8], 1, ScalSeq_SBA, [128]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 1, Conv, [128, 1, 1]]
  - [-1, 2, C3k2_BCSG, [128, True, 0.6]]
  # Reduce N2 to the P3 grid, then join the matching backbone feature.
  - [-1, 1, AAD_v2, [256, 3]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 1, Conv, [256, 1, 1]]
  - [-1, 2, C3k2_BCSG, [256, True, 0.5]]
  - [-1, 1, AAD_v2, [512, 3]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 1, Conv, [512, 1, 1]]
  - [-1, 2, C3k2_BCSG, [512, False, 0.4]]
  # Neck outputs N2/N3/N4 enter the head in increasing stride order.
  - [[12, 16, 20], 1, Detect_PASF_Final, [nc]]
